v2=()=>`<h2>Revisa tu pedido</h2><p class="mut">Quita lo que no necesites antes de elegir la dirección.</p>${items().map(x=>`<div class="row"><em>${x.e}</em><div><b>${x.n}</b><small>${S.cart[x.id]} × ${money(x.p)}</small></div><strong>${money(x.p*S.cart[x.id])}</strong><button class="ic" data-a="rm" data-v="${x.id}" title="Quitar" aria-label="Quitar ${x.n}">✕</button></div>`).join('')}<div class="card">${totals()}${free()}</div>${nav(1,'Elegir dirección')}`,
v3=()=>`<h2>Elige la dirección de entrega</h2><p class="mut">Guarda varias direcciones y usa la que quieras en este pedido.</p>${S.addrs.map((a,i)=>`<button class="ad ${i==S.addr?'on':''}" data-a="addr" data-v="${i}"><i>${i==S.addr?'●':'○'}</i><div><b>${esc(a.l)}</b><small>${esc(a.d)}</small></div></button>`).join('')}<div style="margin-top:12px">${S.adding?`<div class="card add"><label class="f">Nombre de la dirección<div><input id="al" placeholder="Ej. Casa de mamá"></div></label><label class="f">Dirección<div><input id="ad" placeholder="Calle 10 #5-20, Ciudad"></div></label><button class="btn" data-a="save">Guardar dirección</button></div>`:'<button class="btn g" data-a="newaddr">Agregar dirección</button>'}</div>${nav(1,'Ir a confirmar')}`,
v4=()=>{const a=S.addrs[S.addr];return`<h2>Confirma tu pedido</h2><p class="mut">Último paso: revisa el resumen y confirma la compra.</p><div class="card"><div class="tl2"><span>Productos</span><span>${units()} unidades de ${count()} referencias</span></div><div class="tl2"><span>Entrega en</span><span style="text-align:right">${esc(a.l)}: ${esc(a.d)}</span></div><div class="tl2"><span>Llegada estimada</span><span>Mañana, de 9:00 a 12:00</span></div>${totals()}</div><div class="sh">Método de pago</div>${PAY.map(([k,e,n,d])=>`<button class="ad ${S.pay==k?'on':''}" data-a="pay" data-v="${k}"><i>${S.pay==k?'●':'○'}</i><div><b>${e} ${n}</b><small>${d}</small></div></button>`).join('')}<small class="mut">Simulación: no se cobra ni se piden datos de tu tarjeta.</small><div class="nav"><button class="btn g" data-a="back">Volver</button><button class="btn" data-a="ok" ${S.pay?'':'disabled'}>${S.pay?'Confirmar pedido':'Elige un método de pago'}</button></div>`},
v5=()=>{const o=S.order,ms=S.t1-S.t0;return`<div class="hero2"><div class="ok-ic">✓</div><h2>Pedido confirmado</h2><p class="mut">Pedido ${o.id} para ${esc(S.addrs[S.addr].l)} · Pago: ${(PAY.find(x=>x[0]==o.pay)||[])[2]||'—'}</p></div><div class="card code"><small>Código de rastreo</small><div><b>${o.code}</b><button class="btn g" data-a="copy">Copiar código</button></div><small class="mut">Guárdalo: puedes consultarlo desde Rastreo o en Mis pedidos.</small></div>${trk(o)}<div class="card">⏱ Hiciste tu pedido en <b>${mmss(ms)}</b>: ${ms<6e4?'dentro de la meta de 1 minuto ✔':'un poco por encima de la meta de 1 minuto'}. Así "rápido" dejó de ser ambiguo y ahora se puede comprobar.</div><div class="nav"><button class="btn g" data-a="area" data-v="orders">Mis pedidos</button><button class="btn" data-a="again">Hacer otro pedido</button></div>`},
NV=[['area','home','🏠','Inicio'],['cat','nw','✨','Nuevos lanzamientos'],['area','coupons','🎟️','Cupones'],...Object.keys(SEC).filter(k=>k!='nw').map(k=>['cat',k,SEC[k].e,SEC[k].n])],
cpc=c=>{const on=S.cp&&S.cp.c==c.c;return`<div class="cp ${on?'on':''}"><div class="cs">${c.h}</div><div class="cb"><b>${c.d}</b><code>${c.c}</code><button class="btn ${on?'g':''}" data-a="cp" data-v="${c.c}">${on?'Quitar':'Aplicar'}</button></div></div>`},
cpv=()=>`<h2>Cupones</h2><p class="mut">Aplica uno y el descuento se resta al revisar tu pedido.</p><div class="cps" style="margin-top:16px">${CP.map(cpc).join('')}</div>${contBtn()}`,
oc=o=>{const st=stageOf(o);return`<div class="card oc"><div class="oh"><div><b>Pedido ${o.id}</b><small>${fdate(o.conf)} · ${o.code}</small></div><span class="bd ${st==3?'ok':''}" data-live="${o.code}" data-stage="${st}">${TL[st][0]}</span></div><div class="oi">${o.items.map(x=>`<span>${x.e} ${esc(x.n)} ×${x.q}</span>`).join('')}</div><div class="of"><div><small>${esc(o.addr)}</small><b>${money(o.total)}</b></div><div><button class="btn g" data-a="try" data-v="${o.code}">Rastrear</button><button class="btn" data-a="re" data-v="${o.code}">Volver a pedir</button></div></div></div>`},
orders=()=>{const all=Object.values(ORD).filter(o=>o.user==S.user).sort((a,b)=>b.conf-a.conf),f=S.hf,l=all.filter(o=>f=='all'||(f=='live')==(stageOf(o)<3));
 return`<h2>Mis pedidos</h2><p class="mut">${all.length?all.length+' pedido'+(all.length>1?'s':'')+' en total':'Aún no has hecho pedidos.'}</p><div class="tabs2">${[['all','Todos'],['live','En curso'],['done','Entregados']].map(([k,t])=>`<button class="${f==k?'on':''}" data-a="hf" data-v="${k}">${t}</button>`).join('')}</div>${l.length?l.map(oc).join(''):'<div class="card">No hay pedidos en esta lista. Cuando confirmes uno, aparecerá aquí con su código de rastreo.</div>'}`},
side=()=>{const cart=`<div class="card"><h3>Tu pedido</h3>${count()?items().map(x=>`<div class="mini"><span>${x.e} ${x.n} <small>×${S.cart[x.id]}</small></span><span>${money(x.p*S.cart[x.id])}</span></div>`).join('')+`<div class="tl2 big"><span>Total</span><span>${money(tot())}</span></div>`:'<p class="mut">Tu pedido está vacío. Elige un producto para empezar.</p>'}</div>`;
 if(S.area!='shop')return cart;
 const r=ST[S.step],n=NF[S.step];return cart+`<div class="card rq"><small>Requisito ${r[1]}</small><p>"${r[2]}"</p><div><span>✔ Validado</span><span>✔ Verificado</span></div>${r[3]?`<small>${r[3]}</small>`:''}</div><div class="card rq"><small>Requisito no funcional ${n[0]} · ${n[1]}</small><p>"${n[2]}"</p><div><span>📏 Métrica: ${n[3]}</span></div></div>`};
function render(){const key=S.area+S.step+S.sector,ch=render.l!==key;render.l=key;
 document.querySelectorAll('#catnav .cl').forEach(b=>b.classList.toggle('on',b.dataset.a=='area'?S.area==b.dataset.v:S.area=='shop'&&S.step==0&&S.sector==b.dataset.v));
 const cn=$('#cartn');if(cn)cn.textContent=count();
 $('#steps').hidden=S.area!='shop';
 if(S.area=='shop'){$('#steps').innerHTML=ST.map((s,i)=>`<button class="st ${i<S.step?'done':''} ${i==S.step?'cur':''}" ${i<S.step&&S.step<5?`data-a="go" data-v="${i}"`:'disabled'}><i>${i<S.step?'✓':i+1}</i>${s[0]}</button>`).join('');
  $('#main').innerHTML=`<div class="${ch?'v':''}">${[v0,v1,v2,v3,v4,v5][S.step]()}</div>`}
 else $('#main').innerHTML=`<div class="${ch?'v':''}">${({home,search:searchv,track,orders,coupons:cpv})[S.area]()}</div>`;
 $('#side').innerHTML=side();if(ch){scrollTo({top:0,behavior:'smooth'});const on=document.querySelector('#catnav .on');if(on)on.scrollIntoView({inline:'center',block:'nearest'})}}
function confetti(){for(let i=0;i<36;i++){const c=document.createElement('i');c.className='cf';c.style.cssText=`left:${Math.random()*100}vw;background:${['#d91f32','#ff6b78','#9aa0ab','#ffd0d5'][i%4]};animation-delay:${Math.random()*.6}s;--x:${Math.random()*160-80}px`;document.body.append(c);setTimeout(()=>c.remove(),3400)}}
function confirmOrder(){const conf=Date.now();S.t1=conf;const r=n=>Math.random().toString(36).slice(2,2+n).toUpperCase(),d=()=>Math.floor(1000+Math.random()*9000),code=PRE+'-'+r(4)+'-'+d()+'-CO',a=S.addrs[S.addr];
 const o={code,id:'PED-'+d(),user:S.user,addr:a.l+': '+a.d,items:items().map(x=>({n:x.n,e:x.e,p:x.p,q:S.cart[x.id]})),sub:sub(),disc:disc(),ship:ship(),total:tot(),n:units(),conf,pay:S.pay};
 ORD[code]=o;saveO();S.order=o;S.cart={};S.cp=null;S.pay=null;S.step=5;render();confetti()}
function doSearch(){S.query=$('#q').value;S.area='search';render()}
function doTrack(code){code=(code||$('#tc').value||'').trim().toUpperCase();S.trackCode=code;S.trackOrder=ORD[code]||null;S.trackMsg=S.trackOrder?'':(code?'No encontramos un pedido con ese código. Revisa que esté bien escrito o prueba uno de los ejemplos.':'Escribe tu código de rastreo.');S.area='track';render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,v=b.dataset.v;
 if(a=='mode')return setMode(v);
 if(a=='submit')return submit();
 if(a=='demo'){$('#u').value='demo';$('#p').value='demo123';setMode('in');return msg('Cuenta demo cargada. Pulsa Iniciar sesión.','ok')}
 if(a=='eye'){const p=$('#p');p.type=p.type=='password'?'text':'password';return}
 if(a=='theme'){const d=matchMedia('(prefers-color-scheme:dark)').matches,c=R.dataset.theme||(d?'dark':'light');R.dataset.theme=c=='dark'?'light':'dark';return}
 if(a=='out'){clearInterval(tick);$('#shop').hidden=true;$('#auth').hidden=false;$('#p').value='';setMode('in');return}
 if(a=='search')return doSearch();
 if(a=='dotrack')return doTrack();
 if(a=='try')return doTrack(v);
 if(a=='cart'){if(!count()){toast('Tu carrito está vacío. Agrega productos desde Inicio o el buscador.');return}S.area='shop';S.step=2}
 else if(a=='area')S.area=v;
 else if(a=='cat'){S.area='shop';S.sector=v;S.step=0}
 else if(a=='tocart'){S.area='shop';S.step=1}
 else if(a=='sector')S.sector=v;
 else if(a=='tog'){S.cart[v]?delete S.cart[v]:S.cart[v]=1}
 else if(a=='q')S.cart[v]=Math.max(1,Math.min(10,S.cart[v]+ +b.dataset.d));
 else if(a=='rm'){delete S.cart[v];if(!count())S.step=0}
 else if(a=='next')S.step++;
 else if(a=='back')S.step--;
 else if(a=='go')S.step=+v;
 else if(a=='addr')S.addr=+v;
 else if(a=='newaddr')S.adding=true;
 else if(a=='save'){const l=$('#al').value.trim(),d=$('#ad').value.trim();if(!l||!d)return toast('Completa el nombre y la dirección.');S.addrs.push({l,d});S.addr=S.addrs.length-1;S.adding=false;toast('Dirección guardada ✔')}
 else if(a=='pay')S.pay=v;
 else if(a=='ok'){b.textContent='Confirmando…';b.disabled=true;setTimeout(confirmOrder,700);return}
 else if(a=='copy'){try{navigator.clipboard.writeText(S.order.code).then(()=>toast('Código copiado ✔'),()=>toast('Copia el código manualmente.'))}catch(x){toast('Copia el código manualmente.')}return}
 else if(a=='again'){Object.assign(S,{cart:{},step:0,area:'home',t0:Date.now(),t1:0,adding:false,cp:null})}
 else if(a=='hf')S.hf=v;
 else if(a=='cp'){S.cp=S.cp&&S.cp.c==v?null:CP.find(c=>c.c==v);toast(!S.cp?'Cupón quitado':elig(S.cp)?'Cupón aplicado ✔':'Guardado: se activa cuando tu carrito cumpla la condición.')}
 else if(a=='re'){ORD[v].items.forEach(x=>{const p=P.find(y=>y.n==x.n);if(p)S.cart[p.id]=Math.min(10,x.q)});S.area='shop';S.step=2;toast('Agregamos los productos a tu carrito ✔')}
 render()});
document.addEventListener('keydown',e=>{if(e.key!='Enter')return;if(e.target.matches('#u,#p'))submit();else if(e.target.matches('#q'))doSearch();else if(e.target.matches('#tc'))doTrack()});
</script>
</body>
</html>
